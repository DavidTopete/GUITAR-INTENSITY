name: Guitar Gear News Bot

on:
  schedule:
    # Publicacion diaria: 7:43 AM San Luis Rio Colorado / Sonora
    # Sonora = UTC-7 todo el año (no cambia de horario)
    # 7:43 AM = 14:43 UTC
    # Se usa :43 para reducir retrasos de GitHub Actions
    # que suelen ocurrir al inicio de cada hora.
    - cron: '43 14 * * *'

    # Recoleccion de noticias cada 6 horas (no publica nada).
    # Evita perder noticias de los feeds que solo muestran sus
    # ultimas entradas en los dias que no toca publicar.
    # 00:13, 06:13, 12:13 y 18:13 UTC
    - cron: '13 */6 * * *'

  # Permite ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
    inputs:
      comando:
        description: 'diario | recolectar | publicar | estado | validar-feeds'
        default: 'diario'
      dry_run:
        description: 'Simular sin enviar a Telegram (true/false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: guitar-gear-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ======================================================
      # 3. MOSTRAR HORA DE EJECUCIÓN
      # ======================================================
      - name: Show execution time
        run: |
          echo "========================================"
          echo "Guitar Gear News Bot"
          echo "========================================"
          echo "UTC time:"
          date -u
          echo ""
          echo "Sonora time:"
          TZ=America/Hermosillo date
          echo "========================================"


      # ======================================================
      # 4. INSTALAR DEPENDENCIAS
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 5. ELEGIR COMANDO
      #    - cron de las 14:43 UTC  -> diario (recolecta y publica)
      #    - cron cada 6 horas      -> recolectar (no publica)
      #    - ejecucion manual       -> el comando elegido
      # ======================================================
      - name: Choose command
        id: cmd
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
          ENTRADA_CMD: ${{ github.event.inputs.comando }}
          ENTRADA_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [
