name: Guitar Gear News Bot

on:
  schedule:
    # Ejecucion unica diaria: 1:47 AM San Luis Rio Colorado / Sonora
    # Sonora = UTC-7 todo el año (no cambia de horario)
    # 1:47 AM = 08:47 UTC
    # Se usa :47 para reducir retrasos de GitHub Actions
    # que suelen ocurrir al inicio de cada hora.
    - cron: '47 8 * * *'

  # Permite ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
    inputs:
      comando:
        description: 'diario | recolectar | publicar | estado | validar-feeds'
        default: 'diario'
      dry_run:
        description: 'Simular sin enviar a Telegram (true/false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: guitar-gear-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ======================================================
      # 3. MOSTRAR HORA DE EJECUCIÓN
      # ======================================================
      - name: Show execution time
        run: |
          echo "========================================"
          echo "Guitar Gear News Bot"
          echo "========================================"
          echo "UTC time:"
          date -u
          echo ""
          echo "Sonora time:"
          TZ=America/Hermosillo date
          echo "========================================"


      # ======================================================
      # 4. INSTALAR DEPENDENCIAS
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 5. ELEGIR COMANDO
      #    - Ejecucion programada -> diario
      #    - Ejecucion manual     -> comando elegido
      # ======================================================
      - name: Choose command
        id: cmd
        env:
          EVENTO: ${{ github.event_name }}
          MANUAL: ${{ github.event.inputs.comando }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          CMD=diario

          if [ "$EVENTO" = "workflow_dispatch" ]; then
            CMD="$MANUAL"
          fi

          case "$CMD" in
            diario|recolectar|publicar|estado|validar-feeds) ;;
            *) echo "Comando no permitido: $CMD"; exit 1 ;;
          esac

          if [ "$DRY" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "Comando: $CMD"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 6. EJECUTAR BOT
      # ======================================================
      - name: Run Guitar Gear News Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python telegram_bot.py ${{ steps.cmd.outputs.cmd }}


      # ======================================================
      # 7. GUARDAR ESTADO DEL BOT
      #    Se ejecuta aunque el paso anterior falle, para no
      #    perder lo que ya se publico (evita repeticiones).
      # ======================================================
      - name: Save bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking bot state files..."

          # gear_news.db: noticias pendientes, duplicados e historial
          # noticias_enviadas.json: URLs ya publicadas (respaldo)
          for archivo in gear_news.db noticias_enviadas.json; do
            if [ -f "$archivo" ]; then
              git add "$archivo"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes in bot state."
            exit 0
          fi

          echo "Changes detected."

          git commit -m "Update bot state"

          echo "Updating local repository..."
          git pull --rebase origin main

          echo "Pushing updated bot state..."
          git push origin HEAD:main

          echo "Guitar Gear News Bot state successfully updated."
